name = "riesz_prototype"
version = "0.1.0"
defaultTargets = ["FCSolution"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[lean_lib]]
name = "S8s4"
srcDir = "prototype"

[[lean_lib]]
name = "Riesz"

# Vendored, unmodified sources of the OpenAI triangular-lattice development (Apache-2.0):
# see third_party/OpenAIMath/NOTICE.txt.  Only modules OAI.Analysis.Triangular.* exist here.
[[lean_lib]]
name = "OAI"
srcDir = "third_party/OpenAIMath/lean"
leanOptions = {autoImplicit = false}

# Snapshot of the sibling project E8Leach (E8 kernel inequality and Gaussian certificates) and of
# its port of Sphere-Packing-Lean: see third_party/E8Leech/NOTICE.txt and PATCHES.txt.
# The generated Kron* modules are sequences of kernel checks; synchronous elaboration keeps their
# memory bounded (as in the source project).
[[lean_lib]]
name = "E8Leech"
srcDir = "third_party/E8Leech/lean"
moreLeanArgs = ["-DElab.async=false"]

[[lean_lib]]
name = "SpherePacking"
srcDir = "third_party/E8Leech/lean"
leanOptions = {autoImplicit = false, relaxedAutoImplicit = false}

[[lean_lib]]
name = "FCTargetDefinitions"

[[lean_lib]]
name = "FCBridge"

[[lean_lib]]
name = "FCSolution"

# FC utilities for the exact FClikelean Challenge; root Mathlib remains pinned above.
[[require]]
name = "formal_conjectures"
git = "https://github.com/google-deepmind/formal-conjectures.git"
rev = "c77fdd446d23539302aa73bcfae4a9fa962b8382"

[[lean_lib]]
name = "FCDefinitions"

[[lean_lib]]
name = "FCDefinitionBridge"

[[lean_lib]]
name = "FCCoefficientBridge"

[[lean_lib]]
name = "FCAreaBridge"

[[lean_lib]]
name = "FCBackgroundBridge"

[[lean_lib]]
name = "FCBetaIntegral"

[[lean_lib]]
name = "FCE8CoefficientBridge"

[[lean_lib]]
name = "FCEisensteinBridge"

[[lean_lib]]
name = "FCEpsteinBridge"

[[lean_lib]]
name = "FCEpsteinIntegral"

[[lean_lib]]
name = "FCLaplaceLaw"

[[lean_lib]]
name = "FCPoleBetaLaw"

[[lean_lib]]
name = "FCThetaBridge"
